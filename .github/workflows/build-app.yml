name: PromptAll AppSaz Builder
run-name: "AppSaz ${{ inputs.build_uuid }}"

on:
  workflow_dispatch:
    inputs:
      build_uuid:
        description: Build UUID
        required: true
        type: string
      manifest_url:
        description: Manifest endpoint
        required: true
        type: string
      template_url:
        description: Android template endpoint
        required: true
        type: string
      callback_url:
        description: Progress callback endpoint
        required: true
        type: string
      upload_url:
        description: Artifact upload endpoint
        required: true
        type: string
      keystore_url:
        description: Signing keystore endpoint
        required: true
        type: string
      build_token:
        description: One-time build token
        required: true
        type: string

permissions:
  contents: read

env:
  TOKEN: ${{ inputs.build_token }}
  CALLBACK_URL: ${{ inputs.callback_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Mask temporary token
        shell: bash
        run: echo "::add-mask::$TOKEN"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "Android SDK root not found: $SDK_ROOT"; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Build signed application
        id: appsaz_build
        shell: bash
        run: |
          set -Eeuo pipefail
          callback() {
            local status="$1" stage="$2" progress="$3" message="${4:-}"
            python3 - "$status" "$stage" "$progress" "$message" <<'PY' > callback.json
          import json,sys
          print(json.dumps({"status":sys.argv[1],"stage":sys.argv[2],"progress":int(sys.argv[3]),"log":sys.argv[4]},ensure_ascii=False))
          PY
            curl -fsS -X POST -H "Content-Type: application/json" -H "X-AppSaz-Build-Token: $TOKEN" --data-binary @callback.json "$CALLBACK_URL" >/dev/null || true
          }
          fail() { callback failed failed 100 "GitHub Actions build failed"; }
          trap fail ERR

          callback building preparing 8 "دریافت تنظیمات ساخت"
          curl -fsSL -H "X-AppSaz-Build-Token: $TOKEN" "${{ inputs.manifest_url }}" -o manifest.json
          curl -fsSL -H "X-AppSaz-Build-Token: $TOKEN" "${{ inputs.template_url }}" -o template.zip
          mkdir -p work && unzip -q template.zip -d work
          ROOT="$(find work -maxdepth 2 -name settings.gradle -printf '%h\n' | head -n1)"
          test -n "$ROOT"

          callback building assets 22 "آماده‌سازی قالب و اطلاعات اپ"
          python3 - "$ROOT" <<'PY'
          import json,sys,pathlib,html,re
          root=pathlib.Path(sys.argv[1]); m=json.load(open('manifest.json',encoding='utf-8'))
          pkg=re.sub(r'[^A-Za-z0-9_.]','',m['package_name'])
          version=re.sub(r'[^0-9A-Za-z._-]','',str(m.get('version_name','1.0.0')))
          repl={'__PACKAGE__':pkg,'__VERSION_CODE__':str(max(1,int(m.get('version_code',1)))),'__VERSION_NAME__':version}
          for rel in ['app/build.gradle']:
              p=root/rel; s=p.read_text(encoding='utf-8')
              for a,b in repl.items(): s=s.replace(a,b)
              p.write_text(s,encoding='utf-8')
          (root/'app/src/main/res/values/strings.xml').write_text('<resources>\n<string name="app_name">'+html.escape(m['app_name'],quote=True)+'</string>\n</resources>\n',encoding='utf-8')
          cfg={k:m.get(k) for k in ['app_name','config_url','project_key','website_url','connector_rest_base','type','template','primary_color','secondary_color','logo_url','splash_url','branding','features']}
          cfg['local_logo']='media/logo.webp' if m.get('logo_url') else ''
          cfg['local_splash']='media/splash.webp' if (m.get('splash_url') or m.get('logo_url')) else ''
          (root/'app/src/main/assets/app-config.json').write_text(json.dumps(cfg,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          callback building assets 30 "آماده‌سازی آیکون و Splash"
          LOGO_URL="$(python3 -c "import json;print(json.load(open('manifest.json')).get('logo_url') or '')")"
          SPLASH_URL="$(python3 -c "import json;print(json.load(open('manifest.json')).get('splash_url') or json.load(open('manifest.json')).get('logo_url') or '')")"
          mkdir -p "$ROOT/app/src/main/assets/www/media"
          python3 -m pip install --quiet pillow
          if [ -n "$LOGO_URL" ]; then curl -fsSL "$LOGO_URL" -o /tmp/appsaz-logo; fi
          if [ -n "$SPLASH_URL" ]; then curl -fsSL "$SPLASH_URL" -o /tmp/appsaz-splash; fi
          python3 - "$ROOT" <<'PYICON'
          import sys, pathlib, json
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          root=pathlib.Path(sys.argv[1]); m=json.load(open('manifest.json',encoding='utf-8'))
          def open_img(path):
              try:return Image.open(path).convert('RGBA')
              except Exception:return None
          def hexrgb(v, fallback=(37,99,235)):
              try:
                  v=(v or '').lstrip('#');return tuple(int(v[i:i+2],16) for i in (0,2,4))
              except Exception:return fallback
          logo=open_img('/tmp/appsaz-logo')
          splash=open_img('/tmp/appsaz-splash') or logo
          primary=hexrgb(m.get('primary_color'))
          media=root/'app/src/main/assets/www/media';media.mkdir(parents=True,exist_ok=True)
          if logo:
              l=logo.copy();l.thumbnail((640,640),Image.Resampling.LANCZOS);l.save(media/'logo.webp','WEBP',quality=90,method=6)
          if not logo:
              logo=Image.new('RGBA',(1024,1024),primary+(255,));draw=ImageDraw.Draw(logo)
              try:font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',480)
              except Exception:font=ImageFont.load_default()
              label='A';box=draw.textbbox((0,0),label,font=font);draw.text(((1024-(box[2]-box[0]))/2,(1024-(box[3]-box[1]))/2-28),label,font=font,fill=(255,255,255,255))
          master=Image.new('RGBA',(1024,1024),(255,255,255,255))
          fit=ImageOps.contain(logo,(850,850),Image.Resampling.LANCZOS)
          master.alpha_composite(fit,((1024-fit.width)//2,(1024-fit.height)//2))
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/'app/src/main/res'/folder;d.mkdir(parents=True,exist_ok=True)
              icon=master.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png');icon.save(d/'ic_launcher_round.png')
          drawable=root/'app/src/main/res/drawable-nodpi';drawable.mkdir(parents=True,exist_ok=True)
          fg=Image.new('RGBA',(432,432),(0,0,0,0));safe=ImageOps.contain(logo,(300,300),Image.Resampling.LANCZOS);fg.alpha_composite(safe,((432-safe.width)//2,(432-safe.height)//2));fg.save(drawable/'ic_launcher_foreground_image.png')
          anydpi=root/'app/src/main/res/mipmap-anydpi-v26';anydpi.mkdir(parents=True,exist_ok=True)
          adaptive='<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_foreground_image"/></adaptive-icon>'
          (anydpi/'ic_launcher.xml').write_text(adaptive,encoding='utf-8');(anydpi/'ic_launcher_round.xml').write_text(adaptive,encoding='utf-8')
          colors=root/'app/src/main/res/values/colors.xml';colors.write_text('<resources><color name="ic_launcher_bg">#FFFFFF</color></resources>',encoding='utf-8')
          old=root/'app/src/main/res/drawable/ic_launcher_foreground.xml'
          if old.exists(): old.unlink()
          if splash:
              sp=splash.copy();sp.thumbnail((1200,1200),Image.Resampling.LANCZOS);sp.save(media/'splash.webp','WEBP',quality=88,method=6)
          PYICON

          callback building signing 36 "آماده‌سازی امضای نسخه"
          KS_EXISTS="$(python3 -c "import json;print('1' if json.load(open('manifest.json')).get('signing',{}).get('keystore_exists') else '0')")"
          KS_PASS="$(python3 -c "import json;print(json.load(open('manifest.json'))['signing']['password'])")"
          KS_ALIAS="$(python3 -c "import json;print(json.load(open('manifest.json'))['signing'].get('alias','appsaz'))")"
          if [ "$KS_EXISTS" = "1" ]; then
            curl -fsSL -H "X-AppSaz-Build-Token: $TOKEN" "${{ inputs.keystore_url }}" -o "$ROOT/appsaz-release.jks"
          else
            keytool -genkeypair -v -keystore "$ROOT/appsaz-release.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AppSaz, OU=PromptAll, O=PromptAll, L=Tehran, C=IR"
            curl -fsS -X POST -H "X-AppSaz-Build-Token: $TOKEN" -F "kind=keystore" -F "file=@$ROOT/appsaz-release.jks" "${{ inputs.upload_url }}" >/dev/null
          fi
          cat > "$ROOT/keystore.properties" <<EOF
          storeFile=../appsaz-release.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_PASS
          EOF

          FORMAT="$(python3 -c "import json;print(json.load(open('manifest.json')).get('format','apk'))")"
          cd "$ROOT"
          if [ "$FORMAT" = "apk" ] || [ "$FORMAT" = "both" ]; then
            callback building compiling 52 "در حال ساخت APK"
            gradle --no-daemon assembleRelease
            APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
            test -f "$APK"
            callback building uploading 82 "در حال انتقال APK"
            curl -fsS -X POST -H "X-AppSaz-Build-Token: $TOKEN" -F "kind=apk" -F "file=@$APK" "${{ inputs.upload_url }}" >/dev/null
          fi
          if [ "$FORMAT" = "aab" ] || [ "$FORMAT" = "both" ]; then
            callback building compiling 66 "در حال ساخت AAB"
            gradle --no-daemon bundleRelease
            AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)"
            test -f "$AAB"
            callback building uploading 90 "در حال انتقال AAB"
            curl -fsS -X POST -H "X-AppSaz-Build-Token: $TOKEN" -F "kind=aab" -F "file=@$AAB" "${{ inputs.upload_url }}" >/dev/null
          fi
          cd - >/dev/null
          trap - ERR
          callback success done 100 "ساخت با موفقیت انجام شد"

      - name: Notify failure if setup failed
        if: failure() && steps.appsaz_build.outcome != 'failure'
        shell: bash
        run: |
          echo "::add-mask::$TOKEN"
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-AppSaz-Build-Token: $TOKEN" \
            --data '{"status":"failed","stage":"failed","progress":100,"error":"GitHub Actions setup failed"}' "$CALLBACK_URL" >/dev/null || true